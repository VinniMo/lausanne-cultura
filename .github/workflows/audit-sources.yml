# Audit des sources : chaque source répond-elle, et avec quels événements ?
# Le rapport s'affiche sur la page du run (onglet Actions > Summary).
# Lancement manuel : onglet Actions > Audit des sources > Run workflow.
name: Audit des sources

on:
  workflow_dispatch:
  push:
    paths:
      - config.py
      - scraper.py
      - sources/**
      - tools/audit_sources.py
      - .github/workflows/audit-sources.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/audit_sources.py
